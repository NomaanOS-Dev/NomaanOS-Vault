version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. Database: PostgreSQL 16
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nomaanos-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-nomaanos_vault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultadmin} -d ${POSTGRES_DB:-nomaanos_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------
  # 2. Backend API: Node.js Express Zero-Knowledge Service
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nomaanos-vault-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nomaanos_vault}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      APP_BASE_URL: ${APP_BASE_URL:-https://vault.yourdomain.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vault.yourdomain.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-NomaanOS Vault <no-reply@vault.yourdomain.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - send_storage:/app/apps/api/storage
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------------
  # 3. Frontend & Reverse Proxy: Nginx Static Server + API Gateway
  # -------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nomaanos-vault-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - vault-internal
      - vault-public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  vault-internal:
    driver: bridge
    internal: true
  vault-public:
    driver: bridge

volumes:
  postgres_data:
    name: nomaanos_vault_postgres_data
  send_storage:
    name: nomaanos_vault_send_storage
